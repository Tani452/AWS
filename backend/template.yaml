AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KalaMitra - AI Virtual Business Manager for Bharat Artisans (AWS ap-southeast-2)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 25
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        AWS_REGION_NAME: ap-southeast-2
        PRODUCTS_TABLE: !Ref ProductsTable
        ENQUIRIES_TABLE: !Ref EnquiriesTable
        USAGE_TABLE: !Ref UsageTable
        REFERENCE_PRICES_TABLE: !Ref ReferencePricesTable
        MEDIA_BUCKET: !Ref MediaBucket

Resources:
  # ==========================================
  # S3 Media Bucket
  # ==========================================
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - '*'
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteTmpObjectsAfterOneDay
            Status: Enabled
            Prefix: tmp/
            ExpirationInDays: 1

  # ==========================================
  # DynamoDB Tables (On-Demand / Pay-Per-Request)
  # ==========================================
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
        - AttributeName: productId
          KeyType: RANGE

  EnquiriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shopId
          AttributeType: S
        - AttributeName: enquiryId
          AttributeType: S
      KeySchema:
        - AttributeName: shopId
          KeyType: HASH
        - AttributeName: enquiryId
          KeyType: RANGE

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: ownerId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ReferencePricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: category
          KeyType: HASH

  # ==========================================
  # Cognito User Pool & Client
  # ==========================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: kalamitra-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: kalamitra-web-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH

  # ==========================================
  # HTTP API Gateway (v2)
  # ==========================================
  KalaMitraHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
          - X-Requested-With
          - Accept
          - Origin
        AllowOrigins:
          - '*'
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref UserPoolClient
              issuer: !Sub "https://cognito-idp.ap-southeast-2.amazonaws.com/${UserPool}"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ==========================================
  # Lambda Functions
  # ==========================================
  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: upload_url.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        UploadUrlApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /upload-url
            Method: POST

  EnhanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: enhance.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/*"
            - Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        EnhanceApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /enhance
            Method: POST

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: catalog.app.lambda_handler
      Environment:
        Variables:
          AI_PROVIDER: gemini
          GEMINI_KEY_PARAM: /kalamitra/gemini-key
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:ap-southeast-2:${AWS::AccountId}:parameter/kalamitra/gemini-key"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        CatalogApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /catalog
            Method: POST

  PriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: price.app.lambda_handler
      Environment:
        Variables:
          AI_PROVIDER: gemini
          GEMINI_KEY_PARAM: /kalamitra/gemini-key
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:ap-southeast-2:${AWS::AccountId}:parameter/kalamitra/gemini-key"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: !GetAtt ReferencePricesTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        PriceApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /price
            Method: POST

  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: products.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "${MediaBucket.Arn}/*"
      Events:
        GetProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /products
            Method: GET
        PostProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /products
            Method: POST
        DeleteProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /products
            Method: DELETE

  ShopFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: shop.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/*"
      Events:
        GetShop:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /shop/{shopId}
            Method: GET
            Auth:
              Authorizer: NONE

  EnquiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: enquiry.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt EnquiriesTable.Arn
      Events:
        PostEnquiry:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /enquiry
            Method: POST
            Auth:
              Authorizer: NONE

  ExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: export.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt ProductsTable.Arn
      Events:
        ExportCsv:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /export.csv
            Method: GET

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: stats.app.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt ProductsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt EnquiriesTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt UsageTable.Arn
      Events:
        GetStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref KalaMitraHttpApi
            Path: /stats
            Method: GET

# ==========================================
# Outputs
# ==========================================
Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL in ap-southeast-2
    Value: !Sub "https://${KalaMitraHttpApi}.execute-api.ap-southeast-2.amazonaws.com"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  MediaBucketName:
    Description: S3 Media Bucket Name
    Value: !Ref MediaBucket
